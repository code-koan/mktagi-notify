name: Publish to PyPI

# 发布 GitHub Release 就自动发到 PyPI。仓库 secret 需要 PYPI_API_TOKEN。
# 同一个版本号只能发一次，重复发布会失败——改版本号再发。
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: 上传到 PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish dist/*
