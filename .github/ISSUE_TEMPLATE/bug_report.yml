name: 报告问题
description: 发送失败、渲染不对、报错
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        贴日志前先把 webhook 地址、token、chat_id 换成占位符。漏洞请走 SECURITY.md 里的私有渠道。
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: notify-kit 0.1.0
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: 涉及的通道
      multiple: true
      options:
        - 飞书自定义机器人
        - 飞书应用机器人
        - Telegram
        - Slack
        - Discord
        - fanout / from_env
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      placeholder: 期望发出卡片，实际抛了 NotifyError: code=19021
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 怎么复现
      description: 一段能跑的最小代码，凭据用占位符
      render: python
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: 报错或日志
      render: shell
