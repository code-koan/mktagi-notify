[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mktagi-notify"
version = "0.0.1"
description = "统一的消息通知包：飞书 webhook、飞书机器人、Telegram、Slack、Discord"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "code-koan" }]
keywords = ["notifications", "feishu", "lark", "telegram", "slack", "discord", "webhook"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
feishu-bot = ["lark-oapi>=1.7.5"]
telegram = ["python-telegram-bot>=22.8"]
slack = ["slack-sdk>=3.45"]
discord = ["discord.py>=2.7"]
all = [
  "lark-oapi>=1.7.5",
  "python-telegram-bot>=22.8",
  "slack-sdk>=3.45",
  "discord.py>=2.7",
]

[project.urls]
Homepage = "https://github.com/code-koan/mktagi-notify"
Issues = "https://github.com/code-koan/mktagi-notify/issues"
Changelog = "https://github.com/code-koan/mktagi-notify/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
    "pyright>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mktagi_notify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
